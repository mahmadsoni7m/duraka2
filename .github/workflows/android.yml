name: Build Android APK
on: [push, workflow_dispatch]
env:
  GODOT_VERSION: "4.3"
jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r server/requirements.txt
      - run: cd server && SONI_DEV=1 python -m pytest -q
  apk:
    needs: server-tests
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install Android build-tools (target SDK 34)
        run: |
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null || true
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          ls $ANDROID_HOME/build-tools
      - name: Setup templates, keystore, editor settings
        run: |
          echo "HOME=$HOME"
          SRC=/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          ls $SRC | head -30
          for H in "$HOME" /root; do
            mkdir -p $H/.local/share/godot/export_templates $H/.config/godot
            [ -d $H/.local/share/godot/export_templates/${GODOT_VERSION}.stable ] || cp -r $SRC $H/.local/share/godot/export_templates/
          done
          mkdir -p build
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $GITHUB_WORKSPACE/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          JH=$(dirname $(dirname $(readlink -f $(which keytool))))
          for H in "$HOME" /root; do
          cat > $H/.config/godot/editor_settings-4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JH"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          done
          cp $HOME/.config/godot/editor_settings-4.tres $HOME/.config/godot/editor_settings-4.3.tres
          cat $HOME/.config/godot/editor_settings-4.tres
      - name: Import assets
        run: cd godot && godot --headless --import || true
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: cd godot && godot --headless --verbose --export-debug "Android" ../build/DURAKA-SONI-GAMES.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DURAKA-SONI-GAMES-apk
          path: build/DURAKA-SONI-GAMES.apk
          
